version: "3.8"

services:
  n8n:
    image: n8nio/n8n
    restart: always
    ports:
      - "5678:5678"  # Expose n8n web UI on port 5678
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true                 # Enable basic auth
      - N8N_BASIC_AUTH_USER=admin                   # Admin username
      - N8N_BASIC_AUTH_PASSWORD=admin_password      # Admin password - change this!
      - DB_TYPE=mongodb                             # Use MongoDB as DB
      - DB_MONGODB_CONNECTION_URL=mongodb://mongo:27017/n8n  # Mongo connection URL
      - N8N_HOST=localhost                          # Hostname for n8n
      - N8N_PORT=5678                               # Port for n8n
      - N8N_PROTOCOL=http                           # Protocol
    depends_on:
      - mongo
    volumes:
      - n8n_data:/home/node/.n8n                   # Persist n8n user data

  mongo:
    image: mongo:5
    restart: always
    ports:
      - "27017:27017"                              # MongoDB port
    volumes:
      - mongo_data:/data/db                         # Persist MongoDB data

volumes:
  n8n_data:
  mongo_data: